<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Downloader</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body
    class="bg-[#0f1117] text-gray-200 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-rose-500 selection:text-white"
  >
    <div
      class="bg-[#161822] border border-[#232738] rounded-xl p-8 w-full max-w-xl shadow-2xl"
    >
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center space-x-4">
          <div
            class="bg-[#ff3b5c] p-3 rounded-lg shadow-lg shadow-rose-950 flex items-center justify-center"
          >
            <i class="fa-solid fa-play text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">
              YT Downloader
            </h1>
            <p class="text-gray-400 text-xs mt-0.5">
              Simple • Fast • High Quality
            </p>
          </div>
        </div>
        <span class="text-gray-500 font-mono text-xs">v1.0</span>
      </div>

      <!-- Video URL Input Section -->
      <div class="mb-5">
        <label
          class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider"
          >Video URL</label
        >
        <div
          class="flex items-center bg-[#0d0e15] rounded-lg border border-[#262a3d] focus-within:border-[#ff3b5c] transition px-3 py-1"
        >
          <input
            type="text"
            id="urlInput"
            class="bg-transparent w-full p-2 outline-none text-sm text-white placeholder-gray-600"
            placeholder="Paste YouTube link here..."
          />
          <button
            type="button"
            id="pasteBtn"
            class="text-[#ff3b5c] hover:text-rose-400 font-medium text-xs px-2 py-1 transition flex items-center gap-1"
          >
            <i class="fa-regular fa-clipboard"></i> Paste
          </button>
        </div>
      </div>

      <!-- Format & Live Stats -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-[#0d0e15] border border-[#262a3d] p-3 rounded-lg">
          <div
            class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-1"
          >
            Format
          </div>
          <select
            id="formatSelect"
            class="bg-transparent text-xs text-white font-bold outline-none cursor-pointer w-full custom-select"
          >
            <option value="mp4" class="bg-[#161822]">MP4 (Video)</option>
            <option value="mp3" class="bg-[#161822]">MP3 (Audio)</option>
          </select>
        </div>
        <div class="bg-[#0d0e15] border border-[#262a3d] p-3 rounded-lg">
          <div
            class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-1"
          >
            Speed
          </div>
          <div
            id="speedLabel"
            class="text-xs text-[#ff3b5c] font-mono font-bold truncate"
          >
            --
          </div>
        </div>
        <div class="bg-[#0d0e15] border border-[#262a3d] p-3 rounded-lg">
          <div
            class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-1"
          >
            ETA
          </div>
          <div id="etaLabel" class="text-xs text-gray-300 font-mono font-bold">
            --
          </div>
        </div>
      </div>

      <!-- Progress Bar Section -->
      <div class="mb-6">
        <div class="flex justify-between items-center text-xs mb-2">
          <span id="progressText" class="text-gray-400">Ready to download</span>
          <span id="progressPercent" class="font-mono text-[#ff3b5c] font-bold"
            >0%</span
          >
        </div>
        <div
          class="w-full bg-[#0d0e15] rounded-full h-1.5 overflow-hidden border border-[#262a3d]"
        >
          <div
            id="progressBar"
            class="bg-[#ff3b5c] h-full w-0 transition-all duration-300"
          ></div>
        </div>
      </div>

      <!-- Action Button -->
      <button
        id="downloadBtn"
        class="w-full bg-[#ff3b5c] hover:bg-[#e02e4d] active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-lg transition flex items-center justify-center space-x-2 shadow-lg shadow-rose-950/30"
      >
        <i class="fa-solid fa-download"></i>
        <span id="btnText">Download Video</span>
      </button>

      <p
        id="errorMsg"
        class="mt-4 text-xs text-rose-400 text-center hidden"
      ></p>

      <!-- Developer Credit & Socials -->
      <div
        class="mt-7 pt-5 border-t border-[#232738] flex flex-col sm:flex-row items-center justify-between gap-3 text-xs"
      >
        <div class="flex items-center gap-2 text-gray-400">
          <span class="text-gray-500">Developer</span>
          <span class="text-gray-600">•</span>
          <span class="font-medium text-gray-200 tracking-wide">Sad Ibna Forid</span>
        </div>

        <div class="flex items-center gap-2">
          <a
            href="https://github.com/sadudoy"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#0d0e15] border border-[#262a3d] text-gray-300 hover:text-white hover:border-[#ff3b5c]/60 hover:bg-[#1a1d2e] transition duration-200 font-medium group"
            title="GitHub Profile"
          >
            <i
              class="fa-brands fa-github text-sm text-gray-400 group-hover:text-white transition duration-200"
            ></i>
            <span>GitHub</span>
          </a>

          <a
            href="https://www.linkedin.com/in/sadudoy"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#0d0e15] border border-[#262a3d] text-gray-300 hover:text-white hover:border-[#0a66c2]/80 hover:bg-[#1a1d2e] transition duration-200 font-medium group"
            title="LinkedIn Profile"
          >
            <i
              class="fa-brands fa-linkedin text-sm text-[#0a66c2] group-hover:text-[#3b82f6] transition duration-200"
            ></i>
            <span>LinkedIn</span>
          </a>
        </div>
      </div>
    </div>

    <!-- External JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
